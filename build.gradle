plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// MC 1.21.x 需要 Java 21（本机 E:\MC\java\java21，见 gradle.properties 的 org.gradle.java.home）
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // NeoForge 版本（gradle.properties）
    version = neoforge_version

    runs {
        client {
            client()
            gameDirectory = file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            gameDirectory = file('run-server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        // 数据生成：gradlew runData
        data {
            data()
            gameDirectory = file('run-data')
            // MDG 2.0：programArguments 是 ListProperty，用 addAll 追加
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // 可选集成（compile-only，运行时由整合包提供对应 mod；缺失时代码内 ModList 检查自动跳过）
    // jar 均为本仓库 libs/ 下预下载的 1.21.1 NeoForge 版本，避免构建期联网

    // JEI (配方查看器) —— 神之合成在 JEI 里显示/转移配方（common-api + neoforge-api）
    compileOnly files('libs/jei-1.21.1-common-api-19.51.0.417.jar', 'libs/jei-1.21.1-neoforge-api-19.51.0.417.jar')

    // EMI (配方查看器) —— 神之熔炉在 EMI 里显示可熔炼配方
    compileOnly files('libs/emi-1.1.24+1.21.1+neoforge.jar')

    // AE2 (应用能源2) —— 神之工具的“AE存储优先”模式（掉落优先存入ME网络）
    compileOnly files('libs/ae2-1.21.1-neoforge.jar')
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            neoforge_version    : neoforge_version, neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    // 中文 Windows 平台默认编码是 GBK；不指定 UTF-8 会导致含中文的 neoforge.mods.toml 注释
    // 在 expand 过滤时被 GBK 往返破坏成非法 UTF-8，游戏启动时 nightconfig 抛 MalformedInputException。
    filteringCharset = 'UTF-8'

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// ===== 构建产物自动部署 =====
// `gradlew build` 成功后，自动把 jar 同步到本机 1.21.1 测试 mods 目录。
// 目标目录不存在时跳过并警告，不会阻断构建。
def deployTargets = [
        'E:/MC/modpacks/PCL/versions/1.21.1测试/mods', // PCL 测试实例（存在才部署）
        'E:/MC/ALL/mods/自制/1.21.1',                  // ALL 模组仓库（存在才部署）
]

// 正式发布：每次部署自动清理旧版本号 jar（避免同一实例出现多个 godofthings jar）。
def keepOldVersions = false

tasks.register('deployJars') {
    group = 'build'
    description = '把 build/libs 下的 jar 同步到本机 1.21.1 测试 mods 目录。'
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = layout.buildDirectory.file("libs/${mod_id}-${mod_version}.jar").get().asFile
        if (!jarFile.isFile()) {
            throw new GradleException("deployJars: 找不到构建产物 ${jarFile}")
        }
        def anyDeployed = false
        deployTargets.each { target ->
            def dir = file(target)
            if (dir.isDirectory()) {
                // 清理旧版本号的 jar，避免同一实例里出现多个 godofthings jar。
                // keepOldVersions = true 时跳过（测试期间保留旧版以便回退）。
                if (!keepOldVersions) {
                    project.fileTree(dir: dir, include: "${mod_id}-*.jar").each { old ->
                        if (old.name != jarFile.name) {
                            old.delete()
                            logger.lifecycle("deployJars: 清理旧版 {}", old)
                        }
                    }
                }
                java.nio.file.Files.copy(jarFile.toPath(), new File(dir, jarFile.name).toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                logger.lifecycle("deployJars: {} -> {}", jarFile.name, dir)
                anyDeployed = true
            } else {
                logger.warn("deployJars: 目标目录不存在，已跳过: {}", target)
            }
        }
        if (!anyDeployed) {
            logger.warn("deployJars: 没有任何目标目录存在，jar 仅保留在 {}", jarFile)
        }
    }
}

// build 编译失败时 deployJars 不会执行（依赖链保证），成功后自动部署
tasks.named('build').configure {
    dependsOn 'deployJars'
}
