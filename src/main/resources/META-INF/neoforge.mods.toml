modLoader="javafml"
# NeoForge FML 主版本线（1.21.x 为 4）
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]

# 神之工具完整继承了无用之物的 EndlessBeafItem（造化垂青之杖），缺少上游会 NoClassDefFoundError
[[dependencies.godofthings]]
modId = "useless_mod"
type = "required"
versionRange = "[1.21.1-2.4.0,)"
ordering = "AFTER"
side = "BOTH"
    modId="neoforge"
    type="required"
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 声明 Mixin 配置：血条压缩（GuiHeartsCompressMixin）由 FML 加载
[[mixins]]
config="${mod_id}.mixins.json"
