modLoader="javafml"
# NeoForge FML 主版本线（1.21.x 为 4）
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
# 模组列表图标与链接（logo.png 打包在 jar 根目录）
logoFile="logo.png"
displayURL="https://github.com/ZeoNG129/Godofthings"
issueTrackerURL="https://github.com/ZeoNG129/Godofthings/issues"
credits='''整合与维护：ZeoNG129。
部分子系统照抄自开源项目：useless_mod、useless_stretcher（MIT）、PersonalSpace（LGPL-3.0）、
AE2 Lightning Tech Reborn（源码 LGPL-3.0、模型素材 CC BY-NC-SA 3.0，禁止商用）；
神之套装技能树移植自 Zifeng Skill Tree（MIT）。
各部分的适用范围、署名与许可全文见 THIRD_PARTY_NOTICES.md 与 jar 内 META-INF/LICENSE-*。'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="AFTER"
    side="BOTH"

# ⚠ AE2 是**硬依赖**（不是可选）：矿机 / 资源机 / 掉落机 / 合成台 / 砍杀 / 吸收这 6 个方块实体
# 在类声明上直接 implements 了 AE2 的 IGridConnectedBlockEntity，没有 AE2 时本模组会在**加载阶段**
# NoClassDefFoundError 崩掉。如实声明为 required，好在缺依赖时给出「缺 ae2」的明确提示而不是崩溃堆栈。
[[dependencies.${mod_id}]]
    modId="ae2"
    type="required"
    versionRange="[19,)"
    ordering="AFTER"
    side="BOTH"

# ===== 以下均为可选兼容（装了才生效，没装自动跳过）=====
# 统一写 optional + AFTER：既是给整合包工具看的兼容清单，
# 也保证本模组的兼容代码在这些模组的注册表就绪之后才跑。
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

