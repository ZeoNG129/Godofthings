modLoader="javafml"
# NeoForge FML 主版本线（1.21.x 为 4）
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 声明 Mixin 配置：血条压缩（GuiHeartsCompressMixin）由 FML 加载
[[mixins]]
config="${mod_id}.mixins.json"

# 造化杖（太初洞见之杖）的 Mixin：背包带杖即可创造飞行（5 个）、
# 无敌模式与高级隐身的玩家保护（7 个）。照抄自 useless_mod 的 mixin 包。
[[mixins]]
config="${mod_id}.beef.mixins.json"
# 荒辰移晷之杖（照抄 useless_stretcher 扩展模组）的 Mixin：杖的连锁挖掘掉落、
# 工具/扳手标签、战利品箱与矿车战利品表记忆、云层时间加速。
[[mixins]]
config="${mod_id}.beef.stretcher.mixins.json"

# 第三方兼容补丁：Applied Industrialization（modId=aeind）「样板输入仓」的样板槽位 ×5
# （9 → 45，「高级扩展样板输入仓」36 → 180）。该模组没有任何配置文件，槽位数是编译期常量，
# 因此只能在运行时改它对 AE2 构造器的传参；未安装 aeind 时由 AeindMixinPlugin 整体跳过。
[[mixins]]
config="${mod_id}.aeind.mixins.json"
